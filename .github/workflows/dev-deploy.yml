name: (DEV) Deploy to ECS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Create task definition
        id: task-def
        run: |
          cat <<EOF > task-def.json
          {
            "containerDefinitions": [
              {
                "name": "gik-backend-service-dev",
                "image": "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com/gik/backend-dev:latest",
                "cpu": 128,
                "memory": 128,
                "memoryReservation": 64,
                "portMappings": [
                  {
                    "containerPort": 80,
                    "hostPort": 0,
                    "protocol": "tcp"
                  }
                ],
                "essential": true,
                "environment": [
                  { "name": "DB_HOST", "value": "${{ secrets.DEV_DB_HOST }}" },
                  { "name": "DB_PORT", "value": "${{ secrets.DEV_DB_PORT }}" },
                  { "name": "DB_USER", "value": "${{ secrets.DEV_DB_USER }}" },
                  { "name": "DB_PASSWORD", "value": "${{ secrets.DEV_DB_PASSWORD }}" },
                  { "name": "DB_NAME", "value": "${{ secrets.DEV_DB_NAME }}" },
                  { "name": "S3_BUCKET", "value": "${{ secrets.DEV_S3_BUCKET }}" },
                  { "name": "AWS_ACCESS_KEY_ID", "value": "${{ secrets.AWS_ACCESS_KEY }}" },
                  { "name": "AWS_SECRET_ACCESS_KEY", "value": "${{ secrets.AWS_SECRET_ACCESS_KEY }}" },
                  { "name": "JWT_SECRET_KEY", "value": "${{ secrets.JWT_SECRET_KEY }}" },
                  { "name": "HASH_ALGORITHM", "value": "${{ secrets.HASH_ALGORITHM }}" }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/gik-backend-service-dev",
                    "awslogs-create-group": "true",
                    "awslogs-region": "ap-northeast-2",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ],
            "family": "gik-backend-service-dev",
            "taskRoleArn": "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole",
            "executionRoleArn": "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole",
            "networkMode": "bridge",
            "cpu": "128",
            "memory": "128",
            "runtimePlatform": {
              "cpuArchitecture": "X86_64",
              "operatingSystemFamily": "LINUX"
            }
          }
          EOF

      - name: Register task definition
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def.json \
            | jq -r '.taskDefinition.taskDefinitionArn')
          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service gik-backend-service-dev \
            --task-definition ${{ env.TASK_DEF_ARN }} \
            --force-new-deployment

      - name: Deregister old task definitions
        run: |
          OLD_TASK_DEFS=$(aws ecs list-task-definitions \
            --family-prefix gik-backend-service-dev --status ACTIVE \
            | jq -r '.taskDefinitionArns[]' | grep -v ${{ env.TASK_DEF_ARN }})

          for task_def in $OLD_TASK_DEFS; do
            aws ecs deregister-task-definition --task-definition $task_def
          done
